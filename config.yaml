# Obsergent settings: every port, address and path in one place.
#
# Read by src/obsergent/config.py (functions such as config.port(), config.db_path()), by the Makefile
# (through `make config`) and by the scripts. To change a value, edit it here.
# An environment variable with the name shown in [brackets] overrides the value for one run, for example
#       OBSERGENT_PORT=7390 make up
# Secrets are NOT stored here: the model's API keys go in .env, the gateway password in WSO2AP_GW_PASSWORD.
#
# Another file can be used with OBSERGENT_CONFIG=/path/to/config.yaml

# The Obsergent server: the web UI, the REST API and the span receivers.
server:
  host: 127.0.0.1        # [OBSERGENT_HOST] 127.0.0.1 = this machine only (nothing is exposed to the network)
  port: 7318             # [OBSERGENT_PORT] web UI, REST API and OTLP/HTTP (POST /v1/traces)
  grpc_port: 4317        # [OBSERGENT_GRPC_PORT] OTLP/gRPC, used by `make up-grpc` (the WSO2 gateway sends here)
  endpoint: ""           # [OBSERGENT_ENDPOINT] where SDKs and proxies SEND spans; empty = http://<host>:<port>

# Where everything recorded is stored (one SQLite file). ~ means your home folder.
storage:
  path: ~/.obsergent/obsergent.db     # [OBSERGENT_DB]

# What is recorded.
recording:
  max_attr_chars: 4000   # [OBSERGENT_MAX_ATTR_CHARS] longer arguments / results are cut to this many characters

# `make proxy`: the recording proxy in front of a remote MCP server or a gateway.
proxy:
  host: 127.0.0.1
  port: 7319             # [OBSERGENT_PROXY_PORT]

# The WSO2 API Platform gateway (its own repository, started with docker compose).
gateway:
  router: http://localhost:8080                            # [GATEWAY_ROUTER] where MCP traffic goes
  controller: http://localhost:9090/api/management/v1      # [GATEWAY_CONTROLLER] where `make register` registers the MCP server
  username: admin                                          # [WSO2AP_GW_USERNAME] (the password: WSO2AP_GW_PASSWORD, never here)
  mcp_name: wso2                                           # name of the proxy in Obsergent: http://<proxy>/mcp/<mcp_name>
  mcp_context: /bookshop                                   # path of the MCP server in the gateway: <router>/bookshop/mcp

# The example MCP server over HTTP (examples/bookshop/bookshop_http.py), which the gateway protects.
bookshop:
  http_port: 9100        # [BOOKSHOP_PORT]

# What a model call costs. Prices are downloaded automatically from public price lists (nothing of yours is sent) and
# kept in the database with their history; the cost is calculated each time it is shown, from the recorded token counts.
pricing:
  enabled: true          # [OBSERGENT_PRICING] false = no costs at all
  auto_refresh: true     # [OBSERGENT_PRICING_AUTO_REFRESH] false = never download (the only outbound call Obsergent makes)
  refresh_minutes:       # how often each list is checked for changes (the live ones more often; a check costs a few hundred bytes)
    openrouter: 30
    huggingface: 30
    models_dev: 120
    litellm: 120
  exact_from_provider: true   # use the cost OpenRouter and xAI send with every response instead of an estimate
  credits_per_usd: 1          # OpenRouter reports credits; 1 credit = 1 US dollar (checked against its Activity page)
  reprice: call_time     # [OBSERGENT_PRICING_REPRICE] call_time = the price valid when the call was made; now = today's price
  sources:               # the public price lists, in the order they are consulted (see docs/costs.md)
    models_dev: https://models.dev/api.json
    openrouter: https://openrouter.ai/api/v1/models
    huggingface: https://router.huggingface.co/v1/models
    litellm: https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json
  local_providers: [ollama, lmstudio, llamacpp, vllm]   # run on your machine: cost $0, shown as "local"
  overrides: {}          # optional, normally empty. Example: {"my-model": {input_per_million: 0.5, output_per_million: 1.5}}

# Token monitoring. Tokens are the pieces of text models read and write (about three quarters of a word); providers bill by them.
usage:
  daily_token_budget: 0      # [OBSERGENT_TOKEN_BUDGET] tokens you allow per day; 0 = no budget (no warning)
  warn_at_percent: 80        # warn on the Overview and in Things to check from this share of the budget
  question_token_alert: 0    # flag a single question above this many tokens; 0 = flag questions far above your usual
