# AgentTrace settings: every port, address and path in one place.
#
# Read by src/agenttrace/config.py (functions such as config.port(), config.db_path()), by the Makefile
# (through `agenttrace config <key>`) and by the scripts. To change a value, edit it here.
# An environment variable with the name shown in [brackets] overrides the value for one run, for example
#       AGENTTRACE_PORT=7390 agenttrace up
# Secrets are NOT stored here: the model's API keys go in .env, the gateway password in WSO2AP_GW_PASSWORD.
#
# Another file can be used with AGENTTRACE_CONFIG=/path/to/config.yaml

# The AgentTrace server: the web UI, the REST API and the span receivers.
server:
  host: 127.0.0.1        # [AGENTTRACE_HOST] 127.0.0.1 = this machine only (nothing is exposed to the network)
  port: 7318             # [AGENTTRACE_PORT] web UI, REST API and OTLP/HTTP (POST /v1/traces)
  grpc_port: 4317        # [AGENTTRACE_GRPC_PORT] OTLP/gRPC, used by `agenttrace up --grpc` (the WSO2 gateway sends here)
  endpoint: ""           # [AGENTTRACE_ENDPOINT] where SDKs and proxies SEND spans; empty = http://<host>:<port>

# Where everything recorded is stored (one SQLite file). ~ means your home folder.
storage:
  path: ~/.agenttrace/agenttrace.db     # [AGENTTRACE_DB]

# What is recorded.
recording:
  max_attr_chars: 4000   # [AGENTTRACE_MAX_ATTR_CHARS] longer arguments / results are cut to this many characters

# `agenttrace proxy-http`: the recording proxy in front of a remote MCP server or a gateway.
proxy:
  host: 127.0.0.1
  port: 7319             # [AGENTTRACE_PROXY_PORT]

# The WSO2 API Platform gateway (its own repository, started with docker compose).
gateway:
  router: http://localhost:8080                            # [GATEWAY_ROUTER] where MCP traffic goes
  controller: http://localhost:9090/api/management/v1      # [GATEWAY_CONTROLLER] where `make register` registers the MCP server
  username: admin                                          # [WSO2AP_GW_USERNAME] (the password: WSO2AP_GW_PASSWORD, never here)
  mcp_name: wso2                                           # name of the proxy in AgentTrace: http://<proxy>/mcp/<mcp_name>
  mcp_context: /bookshop                                   # path of the MCP server in the gateway: <router>/bookshop/mcp

# The example MCP server over HTTP (examples/bookshop/bookshop_http.py), which the gateway protects.
bookshop:
  http_port: 9100        # [BOOKSHOP_PORT]
