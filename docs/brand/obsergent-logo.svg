<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="Obsergent">
  <g>
  <defs>
    <linearGradient id="ring" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- the observer's ring: an "O" with a 60-degree gap at 1:30 -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="115 23.2" transform="rotate(-14 32 32)"/>
  <!-- the agent, and the trail of its question leaving through the gap -->
  <circle cx="30" cy="34" r="5.2" fill="url(#ring)"/>
  <circle cx="40" cy="24" r="3.6" fill="#f472b6"/>
  <circle cx="48.5" cy="15.5" r="2.6" fill="#f472b6" opacity=".8"/>
  <circle cx="55" cy="9" r="1.8" fill="#f472b6" opacity=".6"/>
  </g>
  <text x="78" y="43" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="700"
        letter-spacing="-0.5" fill="#0f172a">obsergent</text>
</svg>
